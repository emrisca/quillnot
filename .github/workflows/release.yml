name: Release

# A tag is the release. `v0.1.1` builds both macOS architectures and Windows, signs
# the updater archives, and writes the `latest.json` the app checks against.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install the frontend
        run: npm ci

      # `TAURI_SIGNING_PRIVATE_KEY` is the minisign key generated with
      # `npm run tauri signer generate`. Only its public half is in the repository;
      # without the secret the build produces no updater archive, so the app would
      # announce a version it could never verify and install.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: QuillNot v__VERSION__
          releaseBody: |
            QuillNot __VERSION__.

            The builds are not notarised or code-signed, so macOS shows a warning on
            the first launch: right-click the app and choose Open. Updates installed
            from inside the app are verified against the release key instead.

            Once installed, QuillNot updates itself: Settings → Updates.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
