[package]
name = "quillnot"
version = "0.2.5"
description = "A desktop paraphrasing and grammar-checking workspace on OpenRouter's free models"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "quillnot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The network half. rustls rather than the platform TLS stack so the Windows and
# macOS builds link the same code; `stream` is what the SSE reader needs.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
futures-util = "0.3"

# PKCE: a verifier from the OS RNG, its SHA-256 challenge, base64url.
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

# The key lives in the OS keychain, never in a file next to the app.
#
# The backend is opt-in per platform in keyring 3: with the default features alone
# the crate compiles and then fails at runtime with "no backend", which is a bug you
# only discover by trying to sign in. `apple-native` is the Keychain,
# `windows-native` the Credential Manager, and the Linux store is Secret Service over
# pure-Rust crypto so no OpenSSL build is needed there.
# In-app updates. The release workflow signs each updater archive with a minisign key
# and publishes `latest.json`; the public half sits in `tauri.conf.json`, so a build
# signed by anyone else is refused before it replaces this one.
tauri-plugin-updater = "2"

# Typer's stop chord. Escape only reaches the app while this window has focus, which is
# exactly what a run takes away from it, so the panic button is registered with the OS
# instead. Rust owns the shortcut; the webview is never granted its API.
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Typer's Windows injector: `SendInput` with `KEYEVENTF_UNICODE`, so the character is what
# is typed rather than whatever the active keyboard layout makes of a virtual key.
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Typer's X11 injector: XTest posts the key events, and XChangeKeyboardMapping borrows a
# spare keycode for characters the current layout cannot type.
x11-dl = "2.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
